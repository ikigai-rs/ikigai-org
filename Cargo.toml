[package]
name = "ikigai-org"
version = "0.6.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Org-mode agenda as ikigai ROC resources: urn:org:agenda:{period} reads date-fixed events (active timestamps, with repeater expansion) from org files and serves them as text or as the same skolemized Turtle event graph urn:personal:calendar speaks — so org and native calendars union and diff as graphs. TODO entries are resources too: read by id, state or tag, and appended by a conditional write."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-org"
homepage = "https://github.com/ikigai-rs/ikigai-org"
readme = "README.md"
keywords = ["ikigai", "roc", "org-mode", "calendar", "agenda"]
categories = ["date-and-time"]

[dependencies]
# core 0.4.0 (scope opacity, structured denials; the cascade, epic #3893).
ikigai-core = "0.4.0"
async-trait = "0.1"
# Local-time period math + timestamp arithmetic (repeater expansion).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
futures = "0.3"
# The module recipe checks every endpoint and declared action, including
# BODIES and BODY-INPUTS; 0.15.0 is the release on core 0.4.0 (the cascade).
ikigai-conformance = "0.15.0"
# The file space the TODO Sink writes through, in the tests: the real one, on real
# files, because its compare-and-replace is what the Sink's promise rests on. `if-match`
# is new in 0.4.1 (published 2026-11-04); 0.6.0 is the release on core 0.4.0 (the
# cascade), so this is the floor now. ⚠ `^0.6.0` is a CEILING too (<0.7.0).
ikigai-fs = "0.6.0"
