[package]
name = "ikigai-org"
version = "0.1.7"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Org-mode agenda as ikigai ROC resources: urn:org:agenda:{period} reads date-fixed events (active timestamps, with repeater expansion) from org files and serves them as text or as the same skolemized Turtle event graph urn:personal:calendar speaks — so org and native calendars union and diff as graphs."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-org"
homepage = "https://github.com/ikigai-rs/ikigai-org"
readme = "README.md"
keywords = ["ikigai", "roc", "org-mode", "calendar", "agenda"]
categories = ["date-and-time"]

[dependencies]
# 0.1.89: the floor ikigai-conformance 0.6.0 needs (`space_iri`, and `bind`
# dropping a name). The crate's own API floor is lower; this is the floor of the
# graph it is tested against, so it states the truth about what CI exercises.
ikigai-core = "0.1.89"
async-trait = "0.1"
# Local-time period math + timestamp arithmetic (repeater expansion).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`): every endpoint this
# crate binds, every action each declares, every checkable rule at once. 0.6.0
# adds SPACE-NAME (`space(files)` is declared host-named). A `^0.x` pin is a
# ceiling as well as a floor, so this is raised deliberately per minor release.
ikigai-conformance = "0.6.0"
